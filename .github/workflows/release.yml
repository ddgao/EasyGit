name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ steps.extract_version.outputs.version }}

          # 从 CHANGELOG.md 提取当前版本的更新内容
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md

          # 如果提取失败，使用默认内容
          if [ ! -s release_notes.md ]; then
            echo "## EasyGit v$VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" >> release_notes.md
          fi

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: EasyGit v${{ steps.extract_version.outputs.version }}
          body_path: release_notes.md
          files: build/distributions/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to JetBrains Marketplace (Manual)
        run: |
          echo "📦 插件已构建完成！"
          echo "🚀 请手动上传到 JetBrains Marketplace："
          echo "   https://plugins.jetbrains.com/plugin/add"
          echo ""
          echo "📄 插件文件位置："
          ls -lh build/distributions/
